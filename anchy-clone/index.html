      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"

      try {
        document.documentElement.dataset.theme =

            ? "light"
            : "dark";
      } catch {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
